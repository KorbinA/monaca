<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Get Premium Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="js/jquery-ui.css" />
  <link href="css/index.css" rel="stylesheet" type="text/css" />
  <link href="css/newStyle.css" rel="stylesheet" type="text/css" />
  <script type="text/javascript" charset="utf-8" src="cordova.js"></script> 
  <script type="text/javascript" src="js/jquery-1.7.2.min.js"></script>
  <script type="text/javascript" src="js/jquery-1.8.9.ui.js"></script>
  <script src="js/jquery.inputmask.bundle.js"></script>
  <script src="js/spin.min.js"></script>
  <style>
    .wrap {
      width: 100%;
      max-width: 520px;
      padding: 8px;
      margin: 0 auto;
      padding-bottom: 80px; /* space for footer */
    }
    
    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }

    #descriptiontext p {
      font-size: 14.5px;
      color: #5f718a !important;
      line-height: 1.5;
      margin: 8px 0 0 0;
      text-align: center;
    }

    #paymentcard {
      padding: 20px !important;
      margin-top: 20px !important;
    }

    /* Force uniform heights and border radiuses on all input elements */
    .input {
      height: 50px !important;
      box-sizing: border-box;
      border-radius: var(--radius-md) !important;
      border: 1px solid #dbe5f0 !important;
      padding: 14px !important;
    }

    /* Style select dropdowns to match standard input styling exactly */
    select.input {
      appearance: none;
      -webkit-appearance: none;
      background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%235f718a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>") no-repeat right 14px center;
      background-size: 16px;
      padding-right: 38px !important;
      height: 50px !important;
      box-sizing: border-box;
      border-radius: var(--radius-md) !important;
      border: 1px solid #dbe5f0 !important;
      text-align: left !important;
      text-align-last: left !important;
      color: #9ca3af;
    }
    
    select.input option {
      color: #0b1b34;
    }

    .input::placeholder {
      color: #9ca3af !important;
      opacity: 1;
    }

    /* Left-align all field labels explicitly */
    .field label {
      text-align: left !important;
      display: block !important;
      width: 100% !important;
      margin-bottom: 6px !important;
      font-weight: 700;
      font-size: 13px;
      color: var(--muted);
    }

    #messagePopup .ui-dialog-content { text-align: center; }
  </style>
</head>
<body class="gradient">
  <main class="container">
    <div class="wrap">
      <section class="card" id="paymentcard">
        <!-- Page Title and Description -->
        <header style="margin-bottom: 24px;">
          <h1 style="font-size: clamp(22px, 6vw, 28px); font-weight: 900; color: #0b1b34; margin: 0; text-transform: uppercase; letter-spacing: 0.5px;">Activate your card</h1>
          <div id="descriptiontext"></div>
        </header>
         
        <!-- Form -->
        <form id="ccform" style="display: flex; flex-direction: column; gap: 16px;">
          <!-- Name on Card -->
          <div class="field" style="margin: 0; display: flex; flex-direction: column;">
            <label for="name">Name on Card</label>
            <div class="control">
              <input class="input" name="name" id="name" value="" type="text" maxlength="35" placeholder="Name on Card">
            </div>
          </div>

          <!-- Card Number -->
          <div class="field" style="margin: 0; display: flex; flex-direction: column;">
            <label for="cardNumber">Card Number</label>
            <div class="control">
              <input class="input" name="cardNumber" id="cardNumber" value="" type="tel" maxlength="20" placeholder="Card Number">
            </div>
          </div>

          <!-- Expiration Month & Year side-by-side -->
          <div style="display: flex; gap: 16px;">
            <div class="field" style="flex: 1; margin: 0; display: flex; flex-direction: column;">
              <label for="expirationMonth">Exp. Month</label>
              <div class="control">
                <select class="input" name="expirationMonth" id="expirationMonth">
                  <option value="">Month</option>
                  <option value="01">01 - January</option>
                  <option value="02">02 - February</option>
                  <option value="03">03 - March</option>
                  <option value="04">04 - April</option>
                  <option value="05">05 - May</option>
                  <option value="06">06 - June</option>
                  <option value="07">07 - July</option>
                  <option value="08">08 - August</option>
                  <option value="09">09 - September</option>
                  <option value="10">10 - October</option>
                  <option value="11">11 - November</option>
                  <option value="12">12 - December</option>
                </select>
              </div>
            </div>

            <div class="field" style="flex: 1; margin: 0; display: flex; flex-direction: column;">
              <label for="expirationYear">Exp. Year</label>
              <div class="control">
                <select class="input" name="expirationYear" id="expirationYear">
                  <option value="">Year</option>
                  <option value="2026">2026</option>
                  <option value="2027">2027</option>
                  <option value="2028">2028</option>
                  <option value="2029">2029</option>
                  <option value="2030">2030</option>
                  <option value="2031">2031</option>
                  <option value="2032">2032</option>
                  <option value="2033">2033</option>
                  <option value="2034">2034</option>
                  <option value="2035">2035</option>
                  <option value="2036">2036</option>
                  <option value="2037">2037</option>
                  <option value="2038">2038</option>
                  <option value="2039">2039</option>
                  <option value="2040">2040</option>
                </select>
              </div>
            </div>
          </div>

          <!-- CVV & Billing Zip Code side-by-side -->
          <div style="display: flex; gap: 16px;">
            <div class="field" style="flex: 1; margin: 0; display: flex; flex-direction: column;">
              <label for="cvvNumber">CVV Code</label>
              <div class="control">
                <input class="input" name="cvvNumber" id="cvvNumber" value="" type="tel" maxlength="4" placeholder="123">
              </div>
            </div>

            <div class="field" style="flex: 1; margin: 0; display: flex; flex-direction: column;">
              <label for="zipCode">Billing Zip</label>
              <div class="control">
                <input class="input" name="zipCode" id="zipCode" value="" type="number" maxlength="5" placeholder="12345">
              </div>
            </div>
          </div>

          <!-- Referral Code -->
          <div class="field" style="margin: 0; display: flex; flex-direction: column;">
            <label for="referral">Referral Code (Optional)</label>
            <div class="control">
              <input class="input" name="referral" id="referral" value="" type="text" maxlength="30" placeholder="Optional code">
            </div>
          </div>

          <!-- Reworked Pricing Display at the bottom of the form -->
          <div style="margin-top: 8px; border-top: 1px solid #e6ecf2; padding-top: 16px; text-align: left; display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;">Total Due Today</span>
            <!-- Hardcoded price display -->
            <div id="optiontext" style="font-size: 24px; font-weight: 900; color: #16b187; margin: 0; padding: 0;">$25.00</div>
          </div>

          <!-- Purchase & Refund Policy Agreement Checkbox -->
          <div style="display: flex; align-items: flex-start; gap: 10px; margin-top: 6px;">
            <input type="checkbox" id="agree" style="height:18px; width:18px; flex-shrink:0; margin-top: 2px;" />
            <label for="agree" style="font-size:13.5px; color:#5f718a; line-height:1.45; font-weight: 700; text-align: left !important;">
              I agree to the Glass Card <a id="policybutton" style="text-decoration:underline; color:#2066c7; font-weight:800; cursor:pointer;">purchase and refund policy</a>.
            </label>
          </div>

          <button type="button" id="submit" class="btn" style="margin-top: 8px;">Confirm Payment</button>

          <!-- Simple One-Line Small Print Disclaimer -->
          <div style="font-size: 11.5px; color: #5f718a; text-align: center; margin-top: 4px; font-weight: 500; line-height: 1.4;">
            This is a one-time charge. We do not store your card or automatically renew next year.
          </div>
        </form>
      </section>
    </div>
  </main>
      
  <!-- Modal Policy Popup -->
  <div id="popup" class="popup" style="display:none; width:100%; height:100%; position:fixed; top:0; left:0; background:white; overflow-y:auto; z-index:1000; padding: 20px;">
    <a href="#" id="closepopup" style="position:absolute; top:15px; right:15px;"><img src="images/icon_X.png" style="width:25px;"></a>
    <div id="policytext" style="max-width: 600px; margin: 40px auto 80px auto; color: #0b1b34; line-height: 1.6;"></div>
  </div>
  
  <footer class="menu" role="navigation">
    <a class="tab" href="home.html" aria-label="Discover">
      <img src="images/search-grey.png" alt="">
      <span>Discover</span>
    </a>
    <a class="tab" href="profile.html" aria-label="Account">
      <img src="images/account-grey.png" alt="">
      <span>Account</span>
    </a>
  </footer>

  <div id="messagePopup" title="">
    <label id="messageText"></label>
  </div>
          
  <script type="text/javascript">
    $(document).ready(function() {
      $("#cardNumber").inputmask("9999 9999 9999 9999",{ "clearIncomplete": true });
      $("#cvvNumber").inputmask("999",{ "clearIncomplete": true });

      function updateSelectColor(el) {
        if (!el.val()) {
          el.css('color', '#9ca3af');
        } else {
          el.css('color', '#0b1b34');
        }
      }
      $('select.input').each(function() {
        updateSelectColor($(this));
      });
      $('select.input').change(function() {
        updateSelectColor($(this));
      });
      
      // Load static values
      if (window.localStorage.getItem("premiumUntil")) {
        $("#descriptiontext").html("<p>Renew your card today to continue supporting local groups, local businesses, and saving money on every purchase.</p>");
      } else {
        $("#descriptiontext").html("<p>Unlock premium local deals, support fundraising groups, and save money on every purchase. Your card is active for one full year.</p>");
      }

      var defaultPolicy = "<h3>Purchase & Refund Policy</h3><p>All sales of the digital Glass Card are final. Since digital items are immediately accessible upon purchase, we cannot offer refunds once a card has been activated or purchased. If you experience any technical issues with your card, please contact us at support@glasscardapp.com and we will be happy to assist you.</p>";
      $("#policytext").html(defaultPolicy);

      $("#policybutton").click(function() {
        $("#popup").show();
      });
      $("#closepopup").click(function() {
        $("#popup").hide();
      });
      $("#submit").click(function() {
        if(formValidation()) {
          submit();
        }
        return false;
      });

      function submit() {
        var spinner = getSpinner(document.getElementById("paymentcard"));
        var data = {};
        data["cardname"] = $("#name").val();
        data["cardnumber"] = $("#cardNumber").val();
        data["billingzipcode"] = $("#zipCode").val();
        data["expirationmonth"] = $("#expirationMonth").val();
        data["expirationyear"] = $("#expirationYear").val();
        data["cvvnumber"] = $("#cvvNumber").val();
        data["referralcode"] = $("#referral").val();
        data["accountid"] = window.localStorage.getItem("accountId");
        data["customeremail"] = window.localStorage.getItem("deviceID");

        $.post("https://glasscard.org/dataaccessprod4/createTransactionRequest.ashx",
          data,
          function(res) {
            var resObj = JSON.parse(res);
            if(resObj.ok) {
              window.localStorage.setItem("isPremium", true);
              window.location.href = "premium.html";
            } else if(resObj.payment) {
              displayMessage("Error During Account Setup", "Your payment was received but there was an error changing your account. If your account isn't updated in the next hour, please contact us.", "OK");
              spinner.stop();
            } else {
              displayMessage("Error During Payment", "There was an error validating your payment. Check your card or try again later.", "OK");
              spinner.stop();
            }
          }
        )
      }

      function formValidation() {
        if(!$("#name").val().trim()) {
          displayMessage("Form Validation Error", "Please provide a Name", "Ok");
          return false;
        } else if(!$("#cardNumber").val().trim()) {
          displayMessage("Form Validation Error", "Please provide a Card Number", "Ok");
          return false;
        } else if(!$("#expirationMonth").val().trim()) {
          displayMessage("Form Validation Error", "Please provide an Expiration Month", "Ok");
          return false;
        } else if(!$("#expirationYear").val().trim()) {
          displayMessage("Form Validation Error", "Please provide an Expiration Year", "Ok");
          return false;
        } else if(!$("#cvvNumber").val().trim()) {
          displayMessage("Form Validation Error", "Please provide a Security Code", "Ok");
          return false;
        } else if(!$("#zipCode").val().trim()) {
          displayMessage("Form Validation Error", "Please provide a Zip Code", "Ok");
          return false;
        } else if(!$("#agree").is(':checked')) {
          displayMessage("Form Validation Error", "Please agree to the purchase and refund policy", "Ok");
          return false;
        }
        return true;
      }

      function displayMessage(title, message, buttonText, url) {
        $('#messageText').html(message);
        $('#messagePopup').dialog({
          closeOnEscape: false,
          open: function(event, ui) {
            $(this).siblings('.ui-dialog-titlebar').remove();
          },
          buttons:[{
            text:buttonText,
            click:function(){
              $(this).dialog("close");
              if ((url != undefined) && (url.length > 0)) {
                window.location.href = url;
              }
            }
          }]
        });
      }

      document.addEventListener("deviceready", function(){}, false);
    });

    function getSpinner(target) {
      var opts = {
        lines: 13, length: 18, width: 10, radius: 28, scale: 1, corners: 1, color: '#ccc',
        opacity: 0.05, rotate: 0, direction: 1, speed: 1, trail: 60, fps: 20, zIndex: 2e9,
        className: 'spinner', top: '50%', left: '50%', shadow: false, hwaccel: false, position: 'absolute'
      };
      return new Spinner(opts).spin(target);
    }
  </script>
</body>
</html>
