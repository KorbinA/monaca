<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
  <head>
    <title>Location Services</title>
    <meta content="text/html; charset=utf-8" http-equiv="content-type"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <link href="css/index.css" rel="stylesheet" type="text/css"/>
    <script type="text/javascript" src="js/jquery-1.7.2.min.js"></script>
    <script type="text/javascript" src="js/jquery-1.8.9.ui.js"></script>
    <style type="text/css">
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
      }
      .location-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 24px;
        text-align: center;
      }
      .location-card {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.02);
        border: 1px solid #f1f5f9;
      }
      .location-icon {
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
      }
      .pulse {
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.05); opacity: 0.8; }
        100% { transform: scale(1); opacity: 0.5; }
      }
      h2 {
        font-size: 24px;
        font-weight: 800;
        color: #0f172a;
        margin: 0 0 12px 0;
        letter-spacing: -0.5px;
      }
      p {
        font-size: 15px;
        color: #475569;
        line-height: 1.6;
        margin: 0 0 32px 0;
      }
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
      }
      .btn {
        appearance: none;
        border: 0;
        cursor: pointer;
        padding: 14px 20px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 16px;
        text-decoration: none;
        display: block;
        text-align: center;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: #1fab89;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(31, 171, 137, 0.2);
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .btn-secondary {
        background: #f1f5f9;
        color: #475569;
      }
      .btn-secondary:hover {
        background: #e2e8f0;
      }
      .loading-text {
        font-size: 16px;
        color: #64748b;
        font-weight: 600;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="location-container">
      <!-- Initial Loading State -->
      <div id="loadingState" class="location-card">
        <div style="margin-bottom: 20px;">
          <img src="images/location-icon.png" class="location-icon pulse" alt="Location" />
        </div>
        <div class="loading-text">Requesting location access...</div>
      </div>

      <!-- Instructions/Denied State (Initially Hidden) -->
      <div id="instructionState" class="location-card hidden">
        <img src="images/location-icon.png" class="location-icon" alt="Location Required" />
        <h2>Location Access Required</h2>
        <p>To show you nearby deals, Glass Card needs access to your location.<br/><br/>Please open your phone's <b>Settings</b>, find the <b>Glass Card</b> app, and grant it location permissions.</p>
        <div class="btn-group">
          <button id="btnTryAgain" class="btn btn-primary">Try Again</button>
          <button id="btnSkip" class="btn btn-secondary">Skip for Now</button>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      $(document).ready(function() {
        function requestPermission() {
          $('#loadingState').removeClass('hidden');
          $('#instructionState').addClass('hidden');

          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
              if (pos && pos.coords) {
                window.localStorage.setItem("latitude", pos.coords.latitude);
                window.localStorage.setItem("longitude", pos.coords.longitude);
                window.localStorage.setItem("locationTimestamp", String(Date.now()));
              }
              window.location.href = "unlock.html";
            }, function(error) {
              console.log("Geolocation error during onboarding:", error);
              showInstructions();
            }, {
              timeout: 6000,
              enableHighAccuracy: false,
              maximumAge: 0
            });
          } else {
            showInstructions();
          }
        }

        function showInstructions() {
          $('#loadingState').addClass('hidden');
          $('#instructionState').removeClass('hidden');
        }

        // Trigger automatically on load
        requestPermission();

        $('#btnTryAgain').on('click', function() {
          requestPermission();
        });

        $('#btnSkip').on('click', function() {
          window.location.href = "unlock.html";
        });
      });
    </script>
  </body>
</html>
